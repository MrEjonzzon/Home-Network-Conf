services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    restart: unless-stopped
    environment:
      - PUID=998
      - PGID=100
      - TZ=Europe/Stockholm
      - VERSION=docker
    volumes:
      - /tank/appdata/plex/config:/config
      - /tank/shared/nas-shared/torrents/completed/media:/media:ro
    devices:
      - /dev/dri:/dev/dri
